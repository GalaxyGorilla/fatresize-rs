[package]
name = "fatresize"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A clean-room Rust implementation of FAT filesystem resizing"
license = "MIT OR Apache-2.0"
readme = "README.md"

[lib]
name = "fatresize"
path = "src/lib.rs"

[[bin]]
name = "fatresize"
path = "src/main.rs"

[dependencies]

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
strip = "symbols"
